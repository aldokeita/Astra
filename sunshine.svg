<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Astra</title>
  <desc id="desc">A white constellation forming the letter A on a night-black sky.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#121a2e"/>
      <stop offset="0.55" stop-color="#080c14"/>
      <stop offset="1" stop-color="#030405"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#sky)" stroke="#2b3a5c" stroke-width="2"/>

  <g stroke="#c9d6ff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M128 54 74 200"/>
    <path d="M128 54 182 200"/>
    <path d="M98 156 158 156"/>
  </g>

  <g fill="#f4f7ff" filter="url(#glow)">
    <circle cx="128" cy="54" r="9"/>
    <circle cx="74" cy="200" r="7.5"/>
    <circle cx="182" cy="200" r="7.5"/>
    <circle cx="98" cy="156" r="6"/>
    <circle cx="158" cy="156" r="6"/>
  </g>

  <g fill="#c9d6ff">
    <circle cx="62" cy="86" r="2"/>
    <circle cx="196" cy="112" r="2.4"/>
    <circle cx="88" cy="118" r="1.6"/>
    <circle cx="170" cy="68" r="1.8"/>
    <circle cx="44" cy="170" r="1.5"/>
    <circle cx="208" cy="164" r="1.5"/>
  </g>
</svg>
